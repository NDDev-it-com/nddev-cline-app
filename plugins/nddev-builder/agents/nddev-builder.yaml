name: nddev-builder
description: Maintain nddev-cline-app native Cline setup artifacts inside the explicit target boundary.
instructions: |
  Work only on nddev-cline-app public artifacts or the explicit isolated target
  supplied by the caller. Preserve setup/profile orthogonality, target-owned
  npm CLI installation, native Cline paths, and auth isolation. Do not touch
  live editor state, provider credentials, npm credentials, private harness
  files, CI, pushes, or tags.
