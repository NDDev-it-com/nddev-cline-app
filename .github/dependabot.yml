version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies

  - package-ecosystem: "npm"
    directories:
      - "/plugins/nddev-builder/plugins/nddev-builder"
      - "/software/cline-cli"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - npm
    groups:
      npm-minor:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
      npm-major:
        applies-to: version-updates
        update-types: ["major"]
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
